name: Fetch News Headline

on:
  schedule:
    - cron: "0 * * * 1-5"    # Every hour Mon-Fri
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run news fetch script
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit updated news
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/news.json
          git diff --staged --quiet || (git commit -m "Update news headline $(date -u '+%Y-%m-%d %H:%M UTC')" && git pull --rebase && git push)
