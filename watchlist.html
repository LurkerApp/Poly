<!DOCTYPE html>
<html>
  <head>
    <title>Watchlist - Lurker</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="datetime-display" id="datetimeDisplay"></div>
    <div class="page">

      <div class="content-header">
        <h1>Watchlist</h1>
        <p>Track your favourite stocks, insiders and markets in one place</p>
      </div>

      <!-- Locked state -->
      <div style="display:flex; align-items:center; justify-content:center; min-height:400px;">
        <div style="text-align:center; max-width:480px; padding:3rem 2rem;">

          <div style="width:64px; height:64px; border-radius:50%; background:#1f2224; border:1px solid #2a2d30; display:flex; align-items:center; justify-content:center; margin:0 auto 1.5rem;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5a6068" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>

          <div style="display:inline-block; font-size:10px; font-weight:700; letter-spacing:1px; color:#141618; background:#1ABC9C; padding:3px 10px; border-radius:4px; margin-bottom:1.25rem; text-transform:uppercase;">
            Pro Feature
          </div>

          <h2 style="font-size:22px; font-weight:700; color:#e0e0e0; margin-bottom:0.75rem;">
            Upgrade to enable Watchlist
          </h2>

          <p style="font-size:14px; color:#7F8C8D; line-height:1.7; margin-bottom:2rem;">
            Create your personal watchlist to monitor stocks, insiders, and markets — set custom alerts and get notified when something moves.
          </p>

          <button onclick="window.location.href='settings.html'" style="background:#1ABC9C; color:#141618; border:none; font-size:14px; font-weight:700; padding:11px 28px; border-radius:8px; cursor:pointer; font-family:inherit;">
            View Plans
          </button>

        </div>
      </div>

    </div>

    <script src="navbar.js"></script>
    <script src="footer.js"></script>
    <script>
      function updateDateTime() {
        document.getElementById('datetimeDisplay').textContent =
          new Date().toLocaleDateString('en-US', {
            weekday: 'short', month: 'short', day: 'numeric',
            year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit'
          });
      }
      updateDateTime();
      setInterval(updateDateTime, 1000);
    </script>
  </body>
</html>
